<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>任务列表</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 24px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; }
        th { background: #f4f4f4; }
        .actions a, .actions form { display: inline-block; margin-right: 8px; }
        .toolbar { margin-bottom: 12px; }
        input[type=text] { padding: 6px; width: 240px; }
        .btn { padding: 6px 10px; background: #1976d2; color: #fff; text-decoration: none; border-radius: 4px; }
        .btn.secondary { background: #555; }
        .btn.danger { background: #d32f2f; }
    </style>
    <script>
        function confirmDelete(id) {
            if (confirm('确认删除该任务吗？')) {
                document.getElementById('del-' + id).submit();
            }
        }
    </script>
    </head>
<body>
<h1>任务列表</h1>
<div class="toolbar">
    <form method="get" th:action="@{/tasks}" style="display:inline-block;">
        <input type="text" name="q" placeholder="搜索任务名称" th:value="${q}"/>
        <button class="btn secondary" type="submit">搜索</button>
    </form>
    <a class="btn" th:href="@{/tasks/new}">新建任务</a>
    <a class="btn secondary" th:href="@{/h2}" target="_blank">H2 控制台</a>
    <a class="btn secondary" th:href="@{/}">刷新</a>
    <div style="margin-top:8px;color:#666;">提示短信按分钟轮询；控制台日志模拟短信发送。</div>
</div>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>任务名称</th>
        <th>提醒时间</th>
        <th>间隔(分钟)</th>
        <th>内容</th>
        <th>手机号</th>
        <th>状态</th>
        <th>生效</th>
        <th>失效</th>
        <th>上次发送</th>
        <th>上次完成</th>
        <th>操作</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="t : ${tasks}">
        <td th:text="${t.id}"></td>
        <td th:text="${t.name}"></td>
        <td th:text="${#strings.format('%02d:%02d', t.dailyHour, t.dailyMinute)}"></td>
        <td th:text="${t.intervalMinutes}"></td>
        <td th:text="${t.content}"></td>
        <td th:text="${t.phone}"></td>
        <td th:text="${t.status}"></td>
        <td th:text="${t.effectiveFrom}"></td>
        <td th:text="${t.effectiveTo}"></td>
        <td th:text="${t.lastSentAt}"></td>
        <td th:text="${t.lastCompletedAt}"></td>
        <td class="actions">
            <a class="btn secondary" th:href="@{'/tasks/' + ${t.id} + '/edit'}">编辑</a>
            <form th:id="${'del-' + t.id}" th:action="@{'/tasks/' + ${t.id} + '/delete'}" method="post" style="display:inline;">
                <a href="#" class="btn danger" th:onclick="|confirmDelete(${t.id}); return false;|">删除</a>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
