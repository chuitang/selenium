<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>任务表单</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 24px; }
        label { display: block; margin-top: 12px; }
        input, select, textarea { padding: 6px; width: 360px; }
        textarea { height: 80px; }
        .btn { padding: 6px 10px; background: #1976d2; color: #fff; text-decoration: none; border-radius: 4px; border: none; cursor: pointer; }
        .btn.secondary { background: #555; }
        .actions { margin-top: 16px; }
        .row { margin-bottom: 8px; }
        .error { color: #d32f2f; }
    </style>
    <script>
        function initNowIfEmpty(id) {
            var el = document.getElementById(id);
            if (!el.value) {
                el.value = new Date().toISOString().slice(0,16);
            }
        }
    </script>
</head>
<body>
<h1>任务表单</h1>
<form th:action="@{${#httpServletRequest.requestURI}}" th:object="${task}" method="post">
    <div class="row">
        <label>任务名称</label>
        <input type="text" th:field="*{name}" required/>
        <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
    </div>
    <div class="row">
        <label>每日提醒时间 (小时:分钟)</label>
        <input type="number" min="0" max="23" th:field="*{dailyHour}" required style="width:80px;"/> :
        <input type="number" min="0" max="59" th:field="*{dailyMinute}" required style="width:80px;"/>
    </div>
    <div class="row">
        <label>再次提醒间隔（分钟）</label>
        <input type="number" min="1" th:field="*{intervalMinutes}" required/>
    </div>
    <div class="row">
        <label>提醒内容</label>
        <textarea th:field="*{content}" required></textarea>
    </div>
    <div class="row">
        <label>提醒对象手机号</label>
        <input type="text" th:field="*{phone}" required/>
    </div>
    <div class="row">
        <label>任务状态</label>
        <select th:field="*{status}">
            <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
        </select>
    </div>
    <div class="row">
        <label>生效时间</label>
        <input type="datetime-local" id="effectiveFrom" th:field="*{effectiveFrom}" onfocus="initNowIfEmpty('effectiveFrom')" required/>
    </div>
    <div class="row">
        <label>失效时间</label>
        <input type="datetime-local" id="effectiveTo" th:field="*{effectiveTo}" onfocus="initNowIfEmpty('effectiveTo')" required/>
    </div>
    <div class="actions">
        <button class="btn" type="submit">保存</button>
        <a class="btn secondary" th:href="@{/tasks}">返回</a>
    </div>
</form>
</body>
</html>
