<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>任务配置</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/4.6.2/css/bootstrap.min.css}" />
    <style>
        body { padding: 20px; }
    </style>
    <script>
        function confirmDelete(id){
            if(confirm('确认删除该任务吗？')){
                document.getElementById('del-'+id).submit();
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/customParseFormat.js"></script>
    <script>dayjs.extend(window.dayjs_plugin_customParseFormat)</script>
    <script>
        function toForm(){ window.location.href = '/tasks/new'; }
    </script>
    <style>
        .nowrap{white-space:nowrap}
    </style>
</head>
<body>
<div class="container">
    <h3>任务配置</h3>
    <div class="mb-3">
        <form class="form-inline" method="get" th:action="@{/tasks}">
            <input type="text" class="form-control mr-2" name="q" placeholder="搜索任务名称" th:value="${q}" />
            <button type="submit" class="btn btn-primary mr-2">搜索</button>
            <button type="button" class="btn btn-success" onclick="toForm()">新建任务</button>
        </form>
    </div>

    <table class="table table-bordered table-sm">
        <thead>
        <tr>
            <th>ID</th>
            <th>名称</th>
            <th>提醒时间</th>
            <th>间隔(分钟)</th>
            <th>手机号</th>
            <th>状态</th>
            <th>生效</th>
            <th>失效</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="t : ${page.content}">
            <td th:text="${t.id}"></td>
            <td th:text="${t.name}"></td>
            <td class="nowrap" th:text="${t.remindTime}"></td>
            <td th:text="${t.repeatIntervalMinutes}"></td>
            <td class="nowrap" th:text="${t.phoneNumber}"></td>
            <td th:text="${t.status}"></td>
            <td class="nowrap" th:text="${t.effectiveFrom}"></td>
            <td class="nowrap" th:text="${t.effectiveTo}"></td>
            <td>
                <a class="btn btn-sm btn-secondary" th:href="@{'/tasks/' + ${t.id} + '/edit'}">编辑</a>
                <form th:id="${'del-' + t.id}" th:action="@{'/tasks/' + ${t.id} + '/delete'}" method="post" style="display:inline">
                    <button type="button" class="btn btn-sm btn-danger" th:onclick="|confirmDelete(${t.id})|">删除</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <nav>
        <ul class="pagination">
            <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                <a class="page-link" th:href="@{|/tasks?page=${page.number-1}&size=${page.size}&q=${q}|}">上一页</a>
            </li>
            <li class="page-item disabled">
                <span class="page-link" th:text="${page.number + 1} + '/' + ${page.totalPages}"></span>
            </li>
            <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                <a class="page-link" th:href="@{|/tasks?page=${page.number+1}&size=${page.size}&q=${q}|}">下一页</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
