# Jolt转换服务配置

# 服务端口
server.port=8080

# Jolt规则配置
jolt.rules.path=classpath:
jolt.cache.enabled=true

# 日志配置
logging.level.com.example=DEBUG
logging.level.com.bazaarvoice.jolt=INFO

# Jackson配置
spring.jackson.default-property-inclusion=NON_NULL
spring.jackson.serialization.indent-output=true

# 应用信息
spring.application.name=jolt-transformation-service
management.endpoints.web.exposure.include=health,info,metrics