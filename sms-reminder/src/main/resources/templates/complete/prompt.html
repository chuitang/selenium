<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>确认完成</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 24px; }
        .btn { padding: 8px 12px; background: #1976d2; color: #fff; text-decoration: none; border-radius: 4px; }
        .btn.secondary { background: #555; }
    </style>
    <script>
        window.onload = function() {
            var ok = confirm('是否确认完成任务？');
            var taskId = new URLSearchParams(window.location.search).get('taskId');
            if (ok) {
                window.location.href = '/complete/confirm?taskId=' + taskId;
            }
        }
    </script>
</head>
<body>
<h2 th:if="${task}" th:text="${'任务：' + task.name}"></h2>
<div th:if="${message}" th:text="${message}"></div>
<p>若未自动弹窗，请点击确认：</p>
<a class="btn" th:if="${task}" th:href="@{'/complete/confirm'(taskId=${task.id})}">确认完成</a>
<a class="btn secondary" th:href="@{/tasks}">返回任务列表</a>
</body>
</html>
