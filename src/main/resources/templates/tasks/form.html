<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>任务表单</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/4.6.2/css/bootstrap.min.css}" />
    <style> body { padding: 20px; } .form-group { margin-bottom: 12px; } </style>
</head>
<body>
<div class="container">
    <h3 th:text="${#lists.isEmpty(task.id) ? '新建任务' : '编辑任务'}">任务</h3>
    <form th:action="${#lists.isEmpty(task.id) ? '/tasks' : '/tasks/' + task.id}" method="post" th:object="${task}">
        <div class="form-group">
            <label>任务名称</label>
            <input class="form-control" th:field="*{name}" required />
            <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>
        <div class="form-group">
            <label>提醒时间(例如 19:00)</label>
            <input class="form-control" th:field="*{remindTime}" placeholder="HH:mm" required />
            <div class="text-danger" th:if="${#fields.hasErrors('remindTime')}" th:errors="*{remindTime}"></div>
        </div>
        <div class="form-group">
            <label>重复间隔(分钟)</label>
            <input type="number" class="form-control" th:field="*{repeatIntervalMinutes}" min="1" max="1440" required />
        </div>
        <div class="form-group">
            <label>提醒内容</label>
            <textarea class="form-control" th:field="*{content}" rows="3" required></textarea>
        </div>
        <div class="form-group">
            <label>提醒对象(手机号)</label>
            <input class="form-control" th:field="*{phoneNumber}" placeholder="例如 13800000000" required />
            <div class="text-danger" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
        </div>
        <div class="form-group">
            <label>状态</label>
            <select class="form-control" th:field="*{status}">
                <option th:value="${T(com.example.smsreminder.model.ReminderTask.Status).ACTIVE}">ACTIVE</option>
                <option th:value="${T(com.example.smsreminder.model.ReminderTask.Status).PAUSED}">PAUSED</option>
            </select>
        </div>
        <div class="form-group">
            <label>生效时间</label>
            <input class="form-control" th:field="*{effectiveFrom}" placeholder="YYYY-MM-DD" required />
        </div>
        <div class="form-group">
            <label>失效时间(可空)</label>
            <input class="form-control" th:field="*{effectiveTo}" placeholder="YYYY-MM-DD" />
        </div>
        <div class="form-group">
            <button type="submit" class="btn btn-primary">保存</button>
            <a href="/tasks" class="btn btn-secondary">返回</a>
        </div>
    </form>
</div>
</body>
</html>
