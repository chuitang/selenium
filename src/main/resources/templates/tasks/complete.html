<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>任务完成</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/4.6.2/css/bootstrap.min.css}" />
    <style> body { padding: 20px; } </style>
</head>
<body>
<div class="container">
    <h3>确认完成任务</h3>
    <div th:if="${error}" class="alert alert-danger">链接已失效或无效，无法确认。</div>
    <form th:action="@{'/tasks/' + ${taskId} + '/complete'}" method="post" onsubmit="return confirm('是否确认完成本周期任务？');">
        <input type="hidden" name="d" th:value="${dateStr}" />
        <input type="hidden" name="t" th:value="${token}" />
        <button type="submit" class="btn btn-success">确认完成</button>
        <a href="/tasks" class="btn btn-secondary ml-2">返回</a>
    </form>
    <p class="text-muted mt-3">确认后，本周期不再提醒，等下个周期再提醒。</p>
</div>
</body>
</html>
